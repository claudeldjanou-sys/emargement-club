services:
  - type: web
    name: emargement-club
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emargement-club-db
          property: connectionString

databases:
  - name: emargement-club-db
    databaseName: emargement_club
    user: emargement_club
